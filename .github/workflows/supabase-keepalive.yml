# Keeps the free-tier Supabase project from being paused for inactivity.
#
# Supabase pauses Free-plan projects that receive no API requests for ~7 days.
# For a contest build that is a real hazard: a quiet week between the last test
# and judging would leave a judge facing a dead backend. Pinging every ~3 days
# gives roughly 2x margin against GitHub's known cron delays and skips.
#
# The job asserts the status codes so it FAILS LOUDLY — a red badge tells you the
# project already paused, instead of a judge discovering it.
#
# Caveat: GitHub disables scheduled workflows on repositories with no commits for
# 60 days. workflow_dispatch is kept so it can be re-enabled by hand from the
# Actions tab.
#
# Caveat 2, learned the hard way on 2026-07-28: a repository created by GitHub's
# IMPORT tool has its commits written without a push event, so Actions never
# registers the workflow files even though they are plainly there on the default
# branch and Actions is enabled. The Actions tab just shows nothing. Registration
# only happens on a push that MODIFIES the workflow file — touching one file does
# not register its neighbours. If this workflow ever goes missing after a repo
# move, that is why: make a commit that changes this file.
name: Keep Supabase project awake

on:
  schedule:
    # Every 3 days, deliberately off-the-hour (GitHub's cron queue is congested at :00).
    - cron: '17 6 */3 * *'
  workflow_dispatch:

# No repository contents are needed, so grant nothing.
permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping REST and Auth endpoints
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail

          if [ -z "${SUPABASE_URL:-}" ] || [ -z "${SUPABASE_ANON_KEY:-}" ]; then
            echo "::error::SUPABASE_URL / SUPABASE_ANON_KEY repository secrets are not set."
            exit 1
          fi

          # Two endpoints, because which one Supabase's (undocumented) activity
          # heuristic counts is not published. Both are on GoTrue but exercise
          # different paths: /health is service liveness, /settings reads the
          # project's own auth configuration.
          #
          # ── DO NOT "fix" this by pinging /rest/v1/ ────────────────────────────
          # It was doing exactly that until 2026-07-28 and had been failing since at
          # least 07-25. Verified live against this project, both are dead ends and
          # the only ways to make them pass are things this repo forbids:
          #
          #   /rest/v1/           -> 401 {"message":"Secret API key required",
          #                              "hint":"Only secret API keys can be used
          #                              for this endpoint."}
          #      Since the move to sb_publishable_ keys, the REST root is reachable
          #      only with an sb_secret_ key. That key must never enter this repo or
          #      any GitHub secret — see src/lib/supabase.ts.
          #
          #   /rest/v1/backups    -> 401 {"code":"42501"} permission denied
          #      This is `revoke all on public.backups from anon` in
          #      supabase/schema.sql WORKING. That revoke is precisely what makes
          #      shipping the publishable key inside the app safe. Granting anon
          #      SELECT to turn this badge green would trade the security model for
          #      a green tick. Never do it.
          #
          # Note the old failing runs were still issuing real requests to the
          # project, so the keepalive was functionally working the whole time — only
          # the assertion was wrong. Do not read past red runs as "it was paused".
          health=$(curl -sS --max-time 30 -o /dev/null -w '%{http_code}' \
            "${SUPABASE_URL}/auth/v1/health" -H "apikey: ${SUPABASE_ANON_KEY}")
          settings=$(curl -sS --max-time 30 -o /dev/null -w '%{http_code}' \
            "${SUPABASE_URL}/auth/v1/settings" -H "apikey: ${SUPABASE_ANON_KEY}")

          echo "health=${health} settings=${settings}"

          if [ "${health}" != "200" ]; then
            echo "::error::/auth/v1/health returned ${health} — the project may be paused."
            exit 1
          fi
          if [ "${settings}" != "200" ]; then
            echo "::error::/auth/v1/settings returned ${settings} — the project may be paused."
            exit 1
          fi

          echo "Supabase project is awake."
